<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 52px; font-weight: 700; }
    .subtitle { font-size: 26px; fill: #64748b; }
    .col-title { font-size: 34px; font-weight: 700; }
    .col-sub { font-size: 22px; fill: #64748b; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .box-off { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
    .group { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
    .zone { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 10 7; }
    .name { font-size: 24px; font-weight: 600; }
    .detail { font-size: 19px; fill: #64748b; }
    .off { fill: #94a3b8; }
    .group-label { font-size: 19px; font-weight: 600; fill: #475569; letter-spacing: 1px; }
    .zone-label { font-size: 19px; font-weight: 600; fill: #2563eb; letter-spacing: 1px; }
    .edge-label { font-size: 19px; fill: #475569; }
    .blue { fill: #2563eb; }
    .red { fill: #dc2626; }
    .legend { font-size: 19px; fill: #475569; }
    .server { stroke: #64748b; stroke-width: 2; fill: none; }
    .game { stroke: #2563eb; stroke-width: 4; fill: none; }
    .blocked { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 7; fill: none; }
  </style>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- Heading -->
  <text class="title" x="80" y="105">How it works</text>
  <text class="subtitle" x="80" y="150">ds3-blaze gives each game the other player's VPN address, so game traffic never has to cross NAT.</text>
  <line x1="80" y1="185" x2="1840" y2="185" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Column divider -->
  <line x1="960" y1="225" x2="960" y2="900" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== Left: official co-op ===================== -->
  <text class="col-title" x="80" y="250">Official co-op</text>
  <text class="col-sub" x="80" y="282">Through EA's servers</text>

  <rect class="box" x="370" y="300" width="260" height="80" rx="6"/>
  <text class="name" x="500" y="335" text-anchor="middle">EA servers</text>
  <text class="detail" x="500" y="363" text-anchor="middle">login, rooms, matchmaking</text>

  <rect class="box" x="130" y="500" width="240" height="70" rx="6"/>
  <text class="name" x="250" y="530" text-anchor="middle">Open NAT</text>
  <text class="detail" x="250" y="556" text-anchor="middle">home router</text>
  <rect class="box" x="630" y="500" width="240" height="70" rx="6" style="stroke:#dc2626"/>
  <text class="name red" x="750" y="530" text-anchor="middle">Strict NAT</text>
  <text class="detail" x="750" y="556" text-anchor="middle">provider's CGNAT</text>

  <rect class="box" x="130" y="700" width="240" height="90" rx="6"/>
  <text class="name" x="250" y="740" text-anchor="middle">Player A</text>
  <text class="detail" x="250" y="768" text-anchor="middle">Dead Space 3</text>
  <rect class="box" x="630" y="700" width="240" height="90" rx="6"/>
  <text class="name" x="750" y="740" text-anchor="middle">Player B</text>
  <text class="detail" x="750" y="768" text-anchor="middle">Dead Space 3</text>

  <!-- Server traffic: gets through -->
  <path class="server" d="M250,700 V572"/>
  <path class="server" d="M750,700 V572"/>
  <path class="server" d="M250,500 V340 H366" marker-end="url(#arrow-gray)"/>
  <path class="server" d="M750,500 V340 H634" marker-end="url(#arrow-gray)"/>

  <!-- Game traffic: blocked -->
  <path class="blocked" d="M372,535 H628"/>
  <circle cx="585" cy="535" r="20" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <path d="M576,526 L594,544 M594,526 L576,544" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text class="edge-label red" x="500" y="595" text-anchor="middle">Strict NAT blocks the direct game traffic</text>
  <text class="edge-label" x="500" y="622" text-anchor="middle">"Failed to join game"</text>

  <!-- ===================== Right: with ds3-blaze ===================== -->
  <text class="col-title" x="1040" y="250">With ds3-blaze</text>
  <text class="col-sub" x="1040" y="282">Server on the host's PC, both players on one VPN</text>

  <rect class="box-off" x="1300" y="300" width="260" height="80" rx="6"/>
  <text class="name off" x="1430" y="335" text-anchor="middle">EA servers</text>
  <text class="detail off" x="1430" y="363" text-anchor="middle">not used for co-op</text>

  <rect class="zone" x="1040" y="430" width="780" height="440" rx="10"/>
  <text class="zone-label" x="1064" y="463">RADMIN VPN · ONE SUBNET</text>

  <!-- Host PC -->
  <rect class="group" x="1070" y="490" width="300" height="350" rx="8"/>
  <text class="group-label" x="1090" y="520">HOST PC</text>
  <rect class="box" x="1100" y="545" width="240" height="90" rx="6"/>
  <text class="name" x="1220" y="585" text-anchor="middle">Dead Space 3</text>
  <text class="detail" x="1220" y="613" text-anchor="middle">hosts the room</text>
  <rect class="box" x="1100" y="720" width="240" height="90" rx="6" style="stroke:#2563eb"/>
  <text class="name blue" x="1220" y="760" text-anchor="middle">ds3-blaze</text>
  <text class="detail" x="1220" y="788" text-anchor="middle">local Blaze server</text>

  <!-- Guest PC -->
  <rect class="group" x="1490" y="490" width="300" height="350" rx="8"/>
  <text class="group-label" x="1510" y="520">GUEST PC</text>
  <rect class="box" x="1520" y="545" width="240" height="90" rx="6"/>
  <text class="name" x="1640" y="585" text-anchor="middle">Dead Space 3</text>
  <text class="detail" x="1640" y="613" text-anchor="middle">joins the room</text>

  <!-- Server traffic -->
  <path class="server" d="M1220,635 V716" marker-end="url(#arrow-gray)"/>
  <path class="server" d="M1640,635 V765 H1344" marker-end="url(#arrow-gray)"/>
  <text class="edge-label" x="1500" y="755" text-anchor="middle">login, rooms</text>

  <!-- Game traffic -->
  <path class="game" d="M1345,590 H1515" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text class="edge-label blue" x="1430" y="575" text-anchor="middle">game traffic</text>

  <!-- ===================== Legend ===================== -->
  <line x1="80" y1="935" x2="1840" y2="935" stroke="#e2e8f0" stroke-width="2"/>
  <path class="game" d="M80,990 H150"/>
  <text class="legend" x="165" y="997">Game traffic between players (P2P UDP)</text>
  <path class="server" d="M600,990 H670"/>
  <text class="legend" x="685" y="997">Server traffic (Blaze)</text>
  <path class="blocked" d="M935,990 H1005"/>
  <text class="legend" x="1020" y="997">Blocked</text>
  <rect class="zone" x="1160" y="972" width="70" height="36" rx="6"/>
  <text class="legend" x="1245" y="997">VPN network</text>
  <rect class="box-off" x="1430" y="972" width="70" height="36" rx="6"/>
  <text class="legend" x="1515" y="997">Not used</text>
</svg>
