name: CI

# Work happens on <type>/<name> branches merged into main, so every branch push
# is checked, not only main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch supersedes a running check; runs on main and
# on release tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  naming:
    name: Branch and commit names
    # A release tag carries commits main has already checked.
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The range check needs main's history next to the branch's.
          fetch-depth: 0
      - name: Check names
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A pull request is checked from its base; a branch push from main; a
          # push to main from the previous tip, or only its last commit when
          # the push created the branch.
          if ($env:EVENT -eq 'pull_request') {
            $branch = $env:HEAD_REF
            $range = "origin/$($env:BASE_REF)..HEAD"
          } elseif ($env:REF_NAME -ne 'main') {
            $branch = $env:REF_NAME
            $range = 'origin/main..HEAD'
          } elseif ($env:BEFORE -match '^0+$') {
            $branch = 'main'
            $range = 'HEAD~1..HEAD'
          } else {
            $branch = 'main'
            $range = "$($env:BEFORE)..HEAD"
          }
          ./tools/check-commits.ps1 -Range $range -Branch $branch

  hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files
        shell: pwsh
        run: ./tools/check-clean.ps1

  build:
    name: Build and self-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ds3-blaze
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ds3-blaze
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Self-test against a local server
        shell: pwsh
        run: |
          $server = Start-Process -FilePath target/debug/ds3-blaze.exe -ArgumentList serve -PassThru -NoNewWindow
          try {
            # serve binds its listeners at start-up; the redirector port shows it is up.
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-NetConnection 127.0.0.1 -Port 42127 -InformationLevel Quiet -WarningAction SilentlyContinue)) {
              if ($server.HasExited -or (Get-Date) -gt $deadline) { throw 'serve did not start' }
              Start-Sleep -Milliseconds 500
            }
            ./target/debug/ds3-blaze.exe selftest
            if ($LASTEXITCODE -ne 0) {
              Get-Content logs/*.log
              throw "selftest failed with exit code $LASTEXITCODE"
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
