[package]
name = "ds3-blaze-cli"
description = "Local Blaze server for Dead Space 3 co-op over VPN"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The window starts this executable by name for elevated commands
# (gui::elevate::CLI_EXE); its test reads the name from here.
[[bin]]
name = "ds3-blaze-cli"
path = "src/main.rs"

[features]
# The proxy and ea-check commands, for protocol research; release builds leave
# them out.
research = ["dep:blaze-ssl-async", "dep:tdf", "dep:bytes", "dep:tokio-util", "dep:futures"]

[dependencies]
ds3-blaze-core = { path = "../core" }
ds3-blaze-diag = { path = "../diag" }
clap.workspace = true
tokio.workspace = true
blaze-ssl-async = { workspace = true, optional = true }
tdf = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
