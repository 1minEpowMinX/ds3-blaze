[workspace]
members = ["cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# SSLv3 with the ProtoSSL bypass certificate (feature "blaze-cert", on by default)
blaze-ssl-async = "0.4"
tdf = "0.4"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
# Symbols are stripped from the exe; the MSVC linker still writes a .pdb beside
# it, which tools/package.ps1 leaves out of the archive.
strip = true
lto = "thin"
codegen-units = 1
